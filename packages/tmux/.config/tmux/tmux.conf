set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Ctrl+a, then r reloads this config.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Option+Left/Right moves the current window and follows it, without a prefix.
bind -n M-Left swap-window -d -s : -t :-1
bind -n M-Right swap-window -d -s : -t :+1

set -g mouse on
set -g base-index 1
set -g renumber-windows on
setw -g pane-base-index 1
set -g history-limit 10000
set -sg escape-time 0

# Vi copy mode: Space starts a selection; y copies it to the macOS clipboard.
setw -g mode-keys vi
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'

# Rose Pine surface and text, with rose text for the active window.
set -g status-style 'bg=#1f1d2e,fg=#e0def4'
# Keep alerts readable without tmux's default reversed-color rectangle.
setw -g window-status-activity-style 'bg=#1f1d2e,fg=#f6c177,none'
setw -g window-status-bell-style 'bg=#1f1d2e,fg=#f6c177,none'
setw -g window-status-current-style 'bg=#1f1d2e,fg=#ebbcba,bold'
setw -g mode-style 'bg=#ebbcba,fg=#191724,bold'
setw -g tree-mode-preview-style 'bg=#1f1d2e,fg=#ebbcba'
set -g message-style 'bg=#1f1d2e,fg=#ebbcba,fill=#1f1d2e'
set -g message-command-style 'bg=#1f1d2e,fg=#e0def4,fill=#1f1d2e'

# Pane borders: rose active, gold in mode, and love when synchronized.
setw -g pane-border-style 'fg=#403d52'
setw -g pane-active-border-style '#{?pane_in_mode,fg=#f6c177,#{?synchronize-panes,fg=#eb6f92,fg=#ebbcba}}'
set -g display-panes-colour '#6e6a86'
set -g display-panes-active-colour '#ebbcba'

# Copy-mode selection inherits mode-style; search and marks have distinct colors.
setw -g copy-mode-match-style 'bg=#403d52,fg=#e0def4'
setw -g copy-mode-current-match-style 'bg=#ebbcba,fg=#191724,bold'
setw -g copy-mode-mark-style 'bg=#eb6f92,fg=#191724'

# Menus use the same surface and rose selection as the status bar.
set -g menu-style 'bg=#1f1d2e,fg=#e0def4'
set -g menu-selected-style 'bg=#ebbcba,fg=#191724,bold'
set -g menu-border-style 'bg=#1f1d2e,fg=#6e6a86'

# Session badge, spaced window tabs, and a compact date/clock segment.
set -g status-left-length 40
set -g status-right-length 60
set -g status-left '#[bg=#ebbcba,fg=#191724,bold]  #S  #[bg=#1f1d2e,fg=#ebbcba,nobold] '
setw -g window-status-separator ' '
setw -g window-status-format '  #I · #W#{?window_zoomed_flag, ↗,}  '
setw -g window-status-current-format '[ #I · #W#{?window_zoomed_flag, ↗,} ]'
set -g status-right '#[fg=#e0def4,bg=#1f1d2e] %a %d %b  #[fg=#ebbcba]#[fg=#191724,bg=#ebbcba,bold] %H:%M '

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-continuum: auto-save every 15 min + auto-restore on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# tmux-resurrect: capture nvim sessions properly
set -g @resurrect-strategy-nvim 'session'

# Initialize TPM (keep this line at the very bottom)
run '~/.config/tmux/plugins/tpm/tpm'
