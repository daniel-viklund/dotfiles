set -g prefix C-a
unbind C-b
bind C-a send-prefix

# New windows follow the active pane's directory instead of the session's launch directory.
bind c new-window -c '#{pane_current_path}'

# Ctrl+a, then r reloads this config.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Option+Left/Right moves the current window and follows it, without a prefix.
bind -n M-Left swap-window -d -s : -t :-1
bind -n M-Right swap-window -d -s : -t :+1

set -g mouse on
set -g base-index 1
set -g renumber-windows on
setw -g pane-base-index 1
set -g history-limit 10000
set -sg escape-time 0

# Vi copy mode: Space starts a selection; y copies it to the macOS clipboard.
setw -g mode-keys vi
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'

# Black Metal Bathory palette: opaque black with warm gold accents.
setw -g window-style 'bg=#000000,fg=#f1f1f1'
setw -g window-active-style 'bg=#000000,fg=#f1f1f1'
set -g status-style 'bg=#000000,fg=#f1f1f1'
# Keep alerts readable without tmux's default reversed-color rectangle.
setw -g window-status-activity-style 'bg=#000000,fg=#e78a43,none'
setw -g window-status-bell-style 'bg=#000000,fg=#e78a43,none'
setw -g window-status-current-style 'bg=#000000,fg=#fbcb97,bold'
setw -g mode-style 'bg=#fbcb97,fg=#000000,bold'
setw -g tree-mode-preview-style 'bg=#222222,fg=#fbcb97'
set -g message-style 'bg=#222222,fg=#fbcb97,fill=#222222'
set -g message-command-style 'bg=#222222,fg=#f1f1f1,fill=#222222'

# Pane borders: gold active, orange in mode, and teal when synchronized.
setw -g pane-border-style 'bg=#000000,fg=#505050'
setw -g pane-active-border-style 'bg=#000000,#{?pane_in_mode,fg=#e78a43,#{?synchronize-panes,fg=#5f8787,fg=#fbcb97}}'
set -g display-panes-colour '#888888'
set -g display-panes-active-colour '#fbcb97'

# Copy-mode selection inherits mode-style; search and marks have distinct colors.
setw -g copy-mode-match-style 'bg=#505050,fg=#f1f1f1'
setw -g copy-mode-current-match-style 'bg=#fbcb97,fg=#000000,bold'
setw -g copy-mode-mark-style 'bg=#5f8787,fg=#000000'

# Menus use charcoal surfaces and gold selections.
set -g menu-style 'bg=#222222,fg=#f1f1f1'
set -g menu-selected-style 'bg=#fbcb97,fg=#000000,bold'
set -g menu-border-style 'bg=#222222,fg=#888888'

# Session badge, spaced window tabs, and a compact date/clock segment.
set -g status-left-length 40
set -g status-right-length 60
set -g status-left '#[bg=#fbcb97,fg=#000000,bold]  #S  #[bg=#000000,fg=#fbcb97,nobold] '
setw -g window-status-separator ' '
setw -g window-status-format '  #I · #W#{?window_zoomed_flag, ↗,}  '
setw -g window-status-current-format '[ #I · #W#{?window_zoomed_flag, ↗,} ]'
set -g status-right '#[fg=#f1f1f1,bg=#000000] %a %d %b  #[fg=#fbcb97]#[fg=#000000,bg=#fbcb97,bold] %H:%M '

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Ctrl+h/j/k/l crosses Neovim windows and tmux panes without the prefix.
# Ctrl+\ belongs to Neovim's terminal toggle, not previous-pane navigation.
set -g @vim_navigator_mapping_prev ''

# tmux-continuum: auto-save every 15 min + auto-restore on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# tmux-resurrect: capture nvim sessions properly
set -g @resurrect-strategy-nvim 'session'

# Initialize TPM (keep this line at the very bottom)
run '~/.config/tmux/plugins/tpm/tpm'
