set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Sort the session picker by name (numeric prefixes come before letters).
bind s choose-tree -Zs -O name

# New windows follow the active pane's directory instead of the session's launch directory.
bind c new-window -c '#{pane_current_path}'

# Ctrl+a, then r reloads this config.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Option+Left/Right moves the current window and follows it, without a prefix.
bind -n M-Left swap-window -d -s : -t :-1
bind -n M-Right swap-window -d -s : -t :+1

set -g mouse on
set -g base-index 1
set -g renumber-windows on
setw -g pane-base-index 1
set -g history-limit 10000
set -sg escape-time 0
set -s extended-keys on
set -s extended-keys-format csi-u

# Do not pass an automation runner's no-color setting to interactive apps.
set-environment -gu NO_COLOR

# Vi copy mode: Space starts a selection; y copies it to the macOS clipboard.
setw -g mode-keys vi
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
if-shell 'command -v clip.exe >/dev/null 2>&1' 'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"'

# GitHub Dark Default, matching Neovim and Powerlevel10k.
setw -g window-style 'bg=#0d1117,fg=#e6edf3'
setw -g window-active-style 'bg=#0d1117,fg=#e6edf3'
set -g status-style 'bg=#0d1117,fg=#e6edf3'
# Keep alerts readable without tmux's default reversed-color rectangle.
setw -g window-status-activity-style 'bg=#0d1117,fg=#f0883e,none'
setw -g window-status-bell-style 'bg=#0d1117,fg=#f0883e,none'
setw -g window-status-current-style 'bg=#0d1117,fg=#79c0ff,bold'
setw -g mode-style 'bg=#79c0ff,fg=#0d1117,bold'
setw -g tree-mode-preview-style 'bg=#161b22,fg=#79c0ff'
set -g message-style 'bg=#161b22,fg=#79c0ff,fill=#161b22'
set -g message-command-style 'bg=#161b22,fg=#e6edf3,fill=#161b22'

# Pane borders: blue active, orange in mode, and cyan when synchronized.
setw -g pane-border-style 'bg=#0d1117,fg=#21262d'
setw -g pane-active-border-style 'bg=#0d1117,#{?pane_in_mode,fg=#f0883e,#{?synchronize-panes,fg=#b3f0ff,fg=#79c0ff}}'
set -g display-panes-colour '#7d8590'
set -g display-panes-active-colour '#79c0ff'

# Copy-mode selection inherits mode-style; search and marks have distinct colors.
setw -g copy-mode-match-style 'bg=#21262d,fg=#e6edf3'
setw -g copy-mode-current-match-style 'bg=#79c0ff,fg=#0d1117,bold'
setw -g copy-mode-mark-style 'bg=#b3f0ff,fg=#0d1117'

# Menus use dark gray surfaces and blue selections.
set -g menu-style 'bg=#161b22,fg=#e6edf3'
set -g menu-selected-style 'bg=#79c0ff,fg=#0d1117,bold'
set -g menu-border-style 'bg=#161b22,fg=#7d8590'

# Session badge, spaced window tabs, and a compact date/clock segment.
set -g status-left-length 40
set -g status-right-length 60
set -g status-left '#[bg=#79c0ff,fg=#0d1117,bold]  #S  #[bg=#0d1117,fg=#79c0ff,nobold] '
setw -g window-status-separator ' '
setw -g window-status-format '  #I · #W#{?window_zoomed_flag, ↗,}  '
setw -g window-status-current-format '[ #I · #W#{?window_zoomed_flag, ↗,} ]'
set -g status-right '#[fg=#e6edf3,bg=#0d1117] %a %d %b  #[fg=#79c0ff]#[fg=#0d1117,bg=#79c0ff,bold] %H:%M '

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Ctrl+h/j/k/l crosses Neovim windows and tmux panes without the prefix.
# Ctrl+\ belongs to Neovim's terminal toggle, not previous-pane navigation.
set -g @vim_navigator_mapping_prev ''

# tmux-continuum: auto-save every 15 min + auto-restore on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# tmux-resurrect: capture nvim sessions properly
set -g @resurrect-strategy-nvim 'session'

# Initialize TPM (keep this line at the very bottom)
run '~/.config/tmux/plugins/tpm/tpm'
