set -g prefix C-a
unbind C-b
bind C-a send-prefix

# New windows follow the active pane's directory instead of the session's launch directory.
bind c new-window -c '#{pane_current_path}'

# Ctrl+a, then r reloads this config.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Option+Left/Right moves the current window and follows it, without a prefix.
bind -n M-Left swap-window -d -s : -t :-1
bind -n M-Right swap-window -d -s : -t :+1

set -g mouse on
set -g base-index 1
set -g renumber-windows on
setw -g pane-base-index 1
set -g history-limit 10000
set -sg escape-time 0

# Do not pass an automation runner's no-color setting to interactive apps.
set-environment -gu NO_COLOR

# Vi copy mode: Space starts a selection; y copies it to the macOS clipboard.
setw -g mode-keys vi
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
if-shell 'command -v clip.exe >/dev/null 2>&1' 'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"'

# Gruvbox dark (medium contrast), matching Neovim and Powerlevel10k.
setw -g window-style 'bg=#282828,fg=#ebdbb2'
setw -g window-active-style 'bg=#282828,fg=#ebdbb2'
set -g status-style 'bg=#282828,fg=#ebdbb2'
# Keep alerts readable without tmux's default reversed-color rectangle.
setw -g window-status-activity-style 'bg=#282828,fg=#fe8019,none'
setw -g window-status-bell-style 'bg=#282828,fg=#fe8019,none'
setw -g window-status-current-style 'bg=#282828,fg=#fabd2f,bold'
setw -g mode-style 'bg=#fabd2f,fg=#282828,bold'
setw -g tree-mode-preview-style 'bg=#3c3836,fg=#fabd2f'
set -g message-style 'bg=#3c3836,fg=#fabd2f,fill=#3c3836'
set -g message-command-style 'bg=#3c3836,fg=#ebdbb2,fill=#3c3836'

# Pane borders: gold active, orange in mode, and teal when synchronized.
setw -g pane-border-style 'bg=#282828,fg=#665c54'
setw -g pane-active-border-style 'bg=#282828,#{?pane_in_mode,fg=#fe8019,#{?synchronize-panes,fg=#8ec07c,fg=#fabd2f}}'
set -g display-panes-colour '#928374'
set -g display-panes-active-colour '#fabd2f'

# Copy-mode selection inherits mode-style; search and marks have distinct colors.
setw -g copy-mode-match-style 'bg=#665c54,fg=#ebdbb2'
setw -g copy-mode-current-match-style 'bg=#fabd2f,fg=#282828,bold'
setw -g copy-mode-mark-style 'bg=#8ec07c,fg=#282828'

# Menus use warm gray surfaces and yellow selections.
set -g menu-style 'bg=#3c3836,fg=#ebdbb2'
set -g menu-selected-style 'bg=#fabd2f,fg=#282828,bold'
set -g menu-border-style 'bg=#3c3836,fg=#928374'

# Session badge, spaced window tabs, and a compact date/clock segment.
set -g status-left-length 40
set -g status-right-length 60
set -g status-left '#[bg=#fabd2f,fg=#282828,bold]  #S  #[bg=#282828,fg=#fabd2f,nobold] '
setw -g window-status-separator ' '
setw -g window-status-format '  #I · #W#{?window_zoomed_flag, ↗,}  '
setw -g window-status-current-format '[ #I · #W#{?window_zoomed_flag, ↗,} ]'
set -g status-right '#[fg=#ebdbb2,bg=#282828] %a %d %b  #[fg=#fabd2f]#[fg=#282828,bg=#fabd2f,bold] %H:%M '

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Ctrl+h/j/k/l crosses Neovim windows and tmux panes without the prefix.
# Ctrl+\ belongs to Neovim's terminal toggle, not previous-pane navigation.
set -g @vim_navigator_mapping_prev ''

# tmux-continuum: auto-save every 15 min + auto-restore on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# tmux-resurrect: capture nvim sessions properly
set -g @resurrect-strategy-nvim 'session'

# Initialize TPM (keep this line at the very bottom)
run '~/.config/tmux/plugins/tpm/tpm'
